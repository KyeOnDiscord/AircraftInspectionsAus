<script>
  fetch("/blogs/list.json").then(async (response) => {
    let data = await response.json();
    let blogsContainer = document.querySelector(".blogs-grid"); // Ensure the container has a class for grid

    for (let blog of data) {
      let blogElement = document.createElement("div");
      blogElement.classList.add("blog-tile"); // Add a class for styling each tile
      if (blog.filename) {
        blogElement.innerHTML = `
        <a href="/blogs/${blog.filename}"><h6>${blog.title}</h6>
        <p>${blog.content}</p></a>
      `;
      } else if (blog.url) {
        blogElement.innerHTML = `
        <a target="_blank" href="${blog.url}"><h6>${blog.title}</h6>
        <p>${blog.content}</p></a>
      `;
      }

      blogsContainer.appendChild(blogElement);
    }

    //console.log(data);
  });
  document.getElementById("year").innerHTML = new Date().getFullYear();
</script>
<style>
  /* Container for the blog tiles */
  .blogs-grid {
    display: grid;
    grid-template-columns: repeat(
      auto-fill,
      minmax(250px, 1fr)
    ); /* Adjust minmax for tile size */
    gap: 20px; /* Space between tiles */
    padding: 20px; /* Optional padding around the grid */
  }

  /* Individual blog tile styling */
  .blog-tile {
    background-color: #f9f9f9; /* Background color for the tiles */
    border: 1px solid #ccc; /* Border around each tile */
    padding: 15px; /* Inner padding for content */
    border-radius: 8px; /* Rounded corners */
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
  }

  .blog-tile h3 {
    margin-top: 0; /* Remove default top margin for the title */
  }

  .blog-tile p {
    color: #cacaca; /* Optional styling for content text */
  }
</style>
